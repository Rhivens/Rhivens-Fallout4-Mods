; NORA Dangerous Nights - messages narratifs externes
; Emplacement du fichier : Data\F4SE\Plugins\RHI_NDN_messages.ini
; Conservez chaque message sur une seule ligne. Enregistrez les traductions en UTF-8.
; Si ce fichier ou l'une de ces valeurs est manquant, le contrôleur utilise
; le texte anglais de secours intégré.

[Pervert]
BeforeStart=Pendant votre sommeil, une silhouette s'approche silencieusement de votre lit. Une vive piqûre transperce votre peau, suivie d'une étrange chaleur qui se répand dans votre corps. Vos pensées se dissolvent dans une brume artificielle tandis que quelqu'un vous emporte...
OnArrival=Vous reprenez conscience par bribes. Vous êtes dans un endroit inconnu, incapable de vous concentrer ou de réfléchir clairement. Des silhouettes se déplacent autour de vous à travers le brouillard, tandis que votre corps vous semble distant et inerte...
AfterReturn=Vous vous réveillez près de votre lit, étourdie et tout juste capable de penser. Votre vision se brouille et vos souvenirs sont en miettes. Votre corps endolori et les traces laissées sur votre peau rendent la vérité impossible à nier : quelqu'un a abusé de vous pendant que vous étiez inconsciente.
