[Pervert]
BeforeStart=While you sleep, a shadow silently approaches your bed. A sharp sting pierces your skin, followed by a strange warmth spreading through your body. Your thoughts dissolve into a drugged haze as someone carries you away...
OnArrival=Awareness returns in broken fragments. You are somewhere unfamiliar, unable to focus or think clearly. Shapes move around you through the fog while your body feels distant and unresponsive...
AfterReturn=You awaken near your bed, dazed and barely able to think. Your vision swims and your memories are shattered. Your aching body and the traces left on your skin make the truth impossible to deny: someone violated you while you were unconscious.
